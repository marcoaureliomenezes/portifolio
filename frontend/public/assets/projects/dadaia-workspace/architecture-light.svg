<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" aria-label="dadaia-workspace agent diagram — light" viewBox="0 0 640 320">
  <rect width="640" height="320" fill="#f8fafc"/>
  <rect width="620" height="300" x="10" y="10" fill="none" stroke="#cbd5e1" rx="8"/>
  <text x="320" y="36" fill="#7c3aed" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">dadaia-workspace — Agent Topology</text>

  <!-- Operator box -->
  <rect width="160" height="44" x="240" y="55" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" rx="6"/>
  <text x="320" y="74" fill="#1e293b" font-family="monospace" font-size="11" text-anchor="middle">Operator</text>
  <text x="320" y="91" fill="#7c3aed" font-family="monospace" font-size="9" text-anchor="middle">dadaia context activate</text>

  <!-- Arrow down -->
  <path stroke="#94a3b8" stroke-dasharray="4,2" d="M320 99v29"/>

  <!-- Spec Navigator -->
  <rect width="200" height="40" x="220" y="128" fill="#e0f2fe" stroke="#06b6d4" stroke-width="2" rx="6"/>
  <text x="320" y="145" fill="#1e293b" font-family="monospace" font-size="11" text-anchor="middle">Spec Navigator</text>
  <text x="320" y="161" fill="#0284c7" font-family="monospace" font-size="9" text-anchor="middle">loads specs + context</text>

  <!-- Lines to agents -->
  <path stroke="#94a3b8" d="m220 148-80 52m140-32-80 52m160-52 80 52m-20-72 80 52"/>

  <!-- product-engineer -->
  <rect width="120" height="40" x="60" y="200" fill="#dcfce7" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="120" y="218" fill="#065f46" font-family="monospace" font-size="10" text-anchor="middle">product-engineer</text>
  <text x="120" y="232" fill="#6b7280" font-family="monospace" font-size="8" text-anchor="middle">specs + tasks</text>

  <!-- software-engineer -->
  <rect width="120" height="40" x="190" y="220" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
  <text x="250" y="238" fill="#78350f" font-family="monospace" font-size="10" text-anchor="middle">software-engineer</text>
  <text x="250" y="252" fill="#6b7280" font-family="monospace" font-size="8" text-anchor="middle">code + tests</text>

  <!-- qa-engineer -->
  <rect width="120" height="40" x="330" y="220" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="390" y="238" fill="#991b1b" font-family="monospace" font-size="10" text-anchor="middle">qa-engineer</text>
  <text x="390" y="252" fill="#6b7280" font-family="monospace" font-size="8" text-anchor="middle">e2e + validate</text>

  <!-- devops-engineer -->
  <rect width="120" height="40" x="460" y="200" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" rx="6"/>
  <text x="520" y="218" fill="#4c1d95" font-family="monospace" font-size="10" text-anchor="middle">devops-engineer</text>
  <text x="520" y="232" fill="#6b7280" font-family="monospace" font-size="8" text-anchor="middle">infra + deploy</text>

  <text x="320" y="295" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">All agents share: specs/ context + Claude (Anthropic) LLM</text>
</svg>

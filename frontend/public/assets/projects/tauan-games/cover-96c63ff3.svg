<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" aria-label="tauan-games — browser games cover">
  <defs>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#sky-grad)"/>

  <!-- Stars -->
  <circle cx="80" cy="40" r="1.2" fill="#e2e8f0" opacity="0.8"/>
  <circle cx="150" cy="80" r="1" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="300" cy="30" r="1.5" fill="#e2e8f0" opacity="0.7"/>
  <circle cx="500" cy="55" r="1" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="650" cy="25" r="1.3" fill="#e2e8f0" opacity="0.8"/>
  <circle cx="720" cy="70" r="1" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="750" cy="40" r="1.2" fill="#e2e8f0" opacity="0.7"/>
  <circle cx="50" cy="120" r="1" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="420" cy="90" r="0.8" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="570" cy="100" r="1.1" fill="#e2e8f0" opacity="0.7"/>

  <!-- Ground line -->
  <rect x="0" y="360" width="800" height="90" fill="#1a1040" opacity="0.6"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#4a4a7a" stroke-width="1.5"/>

  <!-- Left panel: Aero Fighters -->
  <rect x="50" y="80" width="300" height="250" fill="#0a0a1a" stroke="#7c3aed" stroke-width="2" rx="10" opacity="0.9"/>

  <!-- Airplane (aero-fighters) - pixel art style -->
  <!-- Fuselage -->
  <rect x="185" y="160" width="30" height="80" fill="#a78bfa" rx="2"/>
  <!-- Nose cone -->
  <polygon points="200,140 185,175 215,175" fill="#7c3aed"/>
  <!-- Wings -->
  <polygon points="185,195 140,230 185,215" fill="#5b21b6"/>
  <polygon points="215,195 260,230 215,215" fill="#5b21b6"/>
  <!-- Tail wings -->
  <polygon points="185,235 160,260 185,248" fill="#4c1d95"/>
  <polygon points="215,235 240,260 215,248" fill="#4c1d95"/>
  <!-- Engine exhaust -->
  <rect x="192" y="240" width="6" height="12" fill="#f59e0b" opacity="0.8" rx="1"/>
  <rect x="202" y="240" width="6" height="12" fill="#f59e0b" opacity="0.8" rx="1"/>
  <!-- Cockpit -->
  <circle cx="200" cy="165" r="8" fill="#06b6d4" opacity="0.8"/>

  <!-- Enemies -->
  <circle cx="130" cy="130" r="8" fill="#ef4444" opacity="0.7"/>
  <circle cx="265" cy="150" r="6" fill="#ef4444" opacity="0.6"/>

  <!-- Label -->
  <text x="200" y="310" fill="#a78bfa" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Aero Fighters</text>
  <text x="200" y="328" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">Three.js</text>

  <!-- Right panel: tauan-trex -->
  <rect x="450" y="80" width="300" height="250" fill="#f8fafc" stroke="#10b981" stroke-width="2" rx="10" opacity="0.95"/>

  <!-- Ground inside panel -->
  <rect x="450" y="285" width="300" height="45" fill="#e2e8f0" rx="0"/>
  <line x1="450" y1="285" x2="750" y2="285" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Cactus obstacles -->
  <rect x="660" y="250" width="8" height="35" fill="#475569" rx="2"/>
  <rect x="654" y="260" width="8" height="18" fill="#475569" rx="2"/>
  <rect x="662" y="248" width="8" height="18" fill="#475569" rx="2"/>

  <!-- Dinosaur (pixel art style) -->
  <!-- Body -->
  <rect x="530" y="248" width="40" height="30" fill="#334155" rx="3"/>
  <!-- Head -->
  <rect x="558" y="228" width="30" height="26" fill="#334155" rx="3"/>
  <!-- Eye -->
  <circle cx="582" cy="236" r="4" fill="#f8fafc"/>
  <circle cx="582" cy="236" r="2" fill="#1e293b"/>
  <!-- Mouth/snout -->
  <rect x="580" y="248" width="12" height="4" fill="#475569" rx="1"/>
  <!-- Legs -->
  <rect x="538" y="278" width="8" height="14" fill="#1e293b" rx="1"/>
  <rect x="555" y="278" width="8" height="14" fill="#1e293b" rx="1"/>
  <!-- Tail -->
  <polygon points="530,265 505,275 530,272" fill="#334155"/>
  <!-- Small arm -->
  <rect x="558" y="258" width="10" height="8" fill="#475569" rx="2"/>

  <!-- Label -->
  <text x="600" y="310" fill="#334155" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">tauan-trex</text>
  <text x="600" y="328" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">Phaser</text>

  <!-- Central divider label -->
  <text x="400" y="370" fill="#a78bfa" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">tauan-games</text>
  <text x="400" y="390" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">Browser games built with my son Tauan</text>
</svg>

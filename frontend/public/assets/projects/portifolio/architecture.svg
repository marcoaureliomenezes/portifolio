l(#a)" d="M460 86h60"/><rect width="100" height="52" x="520" y="60" fill="#1e1e3f" stroke="#8b5cf6" stroke-width="2" rx="6"/><text x="570" y="80" fill="#8b5cf6" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Route53</text><text x="570" y="95" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">DNS</text><text x="570" y="108" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">marco-menezes.com</text><path stroke="#4a4a7a" stroke-dasharray="4,2" stroke-width="1.5" d="M570 112v43"/><rect width="120" height="44" x="510" y="155" fill="#1e1e3f" stroke="#ec4899" stroke-width="2" rx="6"/><text x="570" y="174" fill="#ec4899" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Users</text><text x="570" y="190" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Browser</text><path fill="#2d2d4e" d="M40 155h580v1H40z"/><text x="60" y="180" fill="#64748b" font-family="monospace" font-size="10">CI/CD Flow:</text><text x="60" y="200" fill="#94a3b8" font-family="monospace" font-size="9">push → ci.yml (lint+build+test+e2e+lighthouse) → deploy.yml (stage → prod)</text><text x="60" y="218" fill="#94a3b8" font-family="monospace" font-size="9">terraform.yml: plan (PR) → apply (merge) per env [stage | prod]</text><path fill="#2d2d4e" d="M40 240h580v1H40z"/><text x="60" y="262" fill="#64748b" font-family="monospace" font-size="10">IaC:</text><text x="60" y="280" fill="#94a3b8" font-family="monospace" font-size="9">terraform/modules/portfolio-static-site + terraform/envs/{stage,prod}/</text><text x="60" y="298" fill="#94a3b8" font-family="monospace" font-size="9">Remote backend: S3 | Runner: ubuntu-24.04 | Auth: IAM OIDC (no long-lived keys)</text><text x="340" y="338" fill="#4a4a7a" font-family="monospace" font-size="8" text-anchor="middle">Target cost: Route53 $0.50 + S3 ~$0.00 + CloudFront ~$0.00 = &lt; $1/month</text><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="#4a4a7a" d="M0 0v6l8-3z"/></marker></defs></svg>
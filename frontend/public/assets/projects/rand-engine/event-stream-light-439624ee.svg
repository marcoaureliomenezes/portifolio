<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" role="img" aria-label="DataGenerator emits an endless stream of events, each with an event_id and a timestamp_created"><style>text{font-family:ui-monospace,Menlo,Consolas,monospace}.e{animation:drop 8s ease-out infinite both}@keyframes drop{0%{transform:translateY(-50px);opacity:0}10%{transform:none;opacity:1}88%{transform:none;opacity:1}100%{transform:none;opacity:0}}@media (prefers-reduced-motion:reduce){.e{animation:none}}</style><rect width="360" height="262" fill="#fafafa"/><rect x="16" y="10" width="328" height="56" rx="10" fill="#ffffff" stroke="#e5e7eb"/><text x="32" y="33" font-size="13" fill="#282c34">DataGenerator(spec, seed=1)</text><text x="32" y="54" font-size="13" fill="#6b7280">.size(10).stream_dict()</text><path d="M180 68v14m-5-5l5 5l5-5" fill="none" stroke="#f38525" stroke-width="2"/><g class="e" style="animation-delay:0.0s"><rect x="16" y="88" width="328" height="30" rx="8" fill="#ffffff" stroke="#e5e7eb"/><rect x="16" y="88" width="5" height="30" rx="2" fill="#f38525"/><text x="32" y="108" font-size="13" fill="#282c34">event_id 1 <tspan font-size="12" fill="#6b7280">· timestamp_created</tspan></text></g><g class="e" style="animation-delay:1.6s"><rect x="16" y="126" width="328" height="30" rx="8" fill="#ffffff" stroke="#e5e7eb"/><rect x="16" y="126" width="5" height="30" rx="2" fill="#f38525"/><text x="32" y="146" font-size="13" fill="#282c34">event_id 2 <tspan font-size="12" fill="#6b7280">· timestamp_created</tspan></text></g><g class="e" style="animation-delay:3.2s"><rect x="16" y="164" width="328" height="30" rx="8" fill="#ffffff" stroke="#e5e7eb"/><rect x="16" y="164" width="5" height="30" rx="2" fill="#f38525"/><text x="32" y="184" font-size="13" fill="#282c34">event_id 3 <tspan font-size="12" fill="#6b7280">· timestamp_created</tspan></text></g><g class="e" style="animation-delay:4.800000000000001s"><rect x="16" y="202" width="328" height="30" rx="8" fill="#ffffff" stroke="#e5e7eb"/><rect x="16" y="202" width="5" height="30" rx="2" fill="#f38525"/><text x="32" y="222" font-size="13" fill="#282c34">event_id 4 <tspan font-size="12" fill="#6b7280">· timestamp_created</tspan></text></g><text x="180" y="256" text-anchor="middle" font-size="12" fill="#6b7280">never ends</text></svg>

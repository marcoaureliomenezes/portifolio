<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">

  <!-- Background -->
  <rect width="820" height="460" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="410" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">rand-engine — architecture</text>
  <text x="410" y="58" text-anchor="middle" font-size="12" fill="#7d8590">Declarative synthetic data generation for Python</text>

  <!-- ── Column 1: Input ─────────────────────────────────────────── -->
  <text x="110" y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#7d8590" letter-spacing="1">INPUT</text>

  <rect x="30" y="100" width="160" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="110" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#58a6ff">RandSpecs</text>
  <text x="110" y="140" text-anchor="middle" font-size="11" fill="#8b949e">20+ ready-made specs</text>
  <text x="110" y="154" text-anchor="middle" font-size="10" fill="#6e7681">customers · orders · sensors…</text>

  <rect x="30" y="170" width="160" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="110" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#58a6ff">Custom Spec</text>
  <text x="110" y="207" text-anchor="middle" font-size="11" fill="#8b949e">dict / JSON schema</text>

  <!-- ── Column 2: Core ──────────────────────────────────────────── -->
  <text x="410" y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#7d8590" letter-spacing="1">CORE ENGINE</text>

  <rect x="290" y="100" width="240" height="72" rx="8" fill="#0c2d6b" stroke="#388bfd" stroke-width="1.5"/>
  <text x="410" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#58a6ff">DataGenerator</text>
  <text x="410" y="143" text-anchor="middle" font-size="11" fill="#79c0ff">.size(n)  .get_df()  .stream()</text>
  <text x="410" y="160" text-anchor="middle" font-size="10" fill="#8b949e">seed · PK/FK constraints · lazy eval</text>

  <rect x="290" y="186" width="72" height="40" rx="6" fill="#1a1500" stroke="#d29922" stroke-width="1.5"/>
  <text x="326" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#e3b341">NPCore</text>
  <text x="326" y="218" text-anchor="middle" font-size="10" fill="#d29922">NumPy</text>

  <rect x="374" y="186" width="72" height="40" rx="6" fill="#1a1500" stroke="#d29922" stroke-width="1.5"/>
  <text x="410" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#e3b341">PyCore</text>
  <text x="410" y="218" text-anchor="middle" font-size="10" fill="#d29922">patterns</text>

  <rect x="458" y="186" width="72" height="40" rx="6" fill="#1e1030" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="494" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#bc8cff">SparkCore</text>
  <text x="494" y="218" text-anchor="middle" font-size="10" fill="#bc8cff">distributed</text>

  <text x="410" y="248" text-anchor="middle" font-size="10" font-weight="600" fill="#7d8590">FEATURES</text>

  <rect x="290" y="256" width="115" height="36" rx="6" fill="#0d2010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="347" y="271" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">Correlation</text>
  <text x="347" y="285" text-anchor="middle" font-size="10" fill="#2ea043">currency↔country</text>

  <rect x="415" y="256" width="115" height="36" rx="6" fill="#0d2010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="472" y="271" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">Hierarchy</text>
  <text x="472" y="285" text-anchor="middle" font-size="10" fill="#2ea043">dept→level→role</text>

  <!-- ── Column 3: Output ────────────────────────────────────────── -->
  <text x="700" y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#7d8590" letter-spacing="1">OUTPUT</text>

  <rect x="610" y="100" width="175" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="632" cy="122" r="8" fill="#e3b341"/>
  <text x="710" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Pandas DataFrame</text>
  <text x="710" y="135" text-anchor="middle" font-size="10" fill="#6e7681">~132K rows/s local</text>

  <rect x="610" y="156" width="175" height="44" rx="8" fill="#1e1030" stroke="#bc8cff" stroke-width="1.5"/>
  <circle cx="632" cy="178" r="8" fill="#bc8cff"/>
  <text x="710" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#bc8cff">Spark DataFrame</text>
  <text x="710" y="191" text-anchor="middle" font-size="10" fill="#bc8cff">5.1M rows/s (Databricks)</text>

  <rect x="610" y="212" width="175" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="697" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">File Export</text>
  <text x="697" y="247" text-anchor="middle" font-size="11" fill="#8b949e">CSV · Parquet · JSON</text>
  <text x="697" y="262" text-anchor="middle" font-size="10" fill="#6e7681">batch · stream · partitioned</text>

  <!-- ── Arrows ───────────────────────────────────────────────────── -->
  <line x1="190" y1="128" x2="288" y2="128" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arr-blue-d)"/>
  <line x1="190" y1="192" x2="270" y2="155" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arr-blue-d)"/>

  <line x1="326" y1="172" x2="326" y2="184" stroke="#d29922" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="410" y1="172" x2="410" y2="184" stroke="#d29922" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="494" y1="172" x2="494" y2="184" stroke="#bc8cff" stroke-width="1" stroke-dasharray="3,2"/>

  <line x1="532" y1="122" x2="608" y2="122" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr-gray-d)"/>
  <line x1="532" y1="136" x2="608" y2="175" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arr-purple-d)"/>
  <line x1="532" y1="145" x2="608" y2="228" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-gray-d)"/>

  <!-- ── Bottom stats ─────────────────────────────────────────────── -->
  <rect x="30" y="320" width="760" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="410" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#7d8590">PERFORMANCE BENCHMARKS</text>

  <text x="130" y="365" text-anchor="middle" font-size="20" font-weight="700" fill="#58a6ff">132K</text>
  <text x="130" y="378" text-anchor="middle" font-size="10" fill="#7d8590">rows/s · local CPython</text>

  <line x1="240" y1="328" x2="240" y2="372" stroke="#30363d" stroke-width="1"/>

  <text x="330" y="365" text-anchor="middle" font-size="20" font-weight="700" fill="#bc8cff">5.1M</text>
  <text x="330" y="378" text-anchor="middle" font-size="10" fill="#7d8590">rows/s · Databricks Spark</text>

  <line x1="440" y1="328" x2="440" y2="372" stroke="#30363d" stroke-width="1"/>

  <text x="540" y="365" text-anchor="middle" font-size="20" font-weight="700" fill="#3fb950">494</text>
  <text x="540" y="378" text-anchor="middle" font-size="10" fill="#7d8590">tests passing · MIT</text>

  <line x1="640" y1="328" x2="640" y2="372" stroke="#30363d" stroke-width="1"/>

  <text x="730" y="365" text-anchor="middle" font-size="20" font-weight="700" fill="#e3b341">20+</text>
  <text x="730" y="378" text-anchor="middle" font-size="10" fill="#7d8590">ready-made specs</text>

  <!-- ── Footer ───────────────────────────────────────────────────── -->
  <text x="410" y="420" text-anchor="middle" font-size="11" fill="#6e7681">pip install rand-engine  ·  github.com/marcoaureliomenezes/rand_engine  ·  pypi.org/project/rand-engine</text>
  <text x="410" y="445" text-anchor="middle" font-size="11" font-weight="600" fill="#7d8590">Built for data engineering — test the flow, not the data.</text>

  <!-- ── Arrow markers ─────────────────────────────────────────────── -->
  <defs>
    <marker id="arr-blue-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#388bfd"/>
    </marker>
    <marker id="arr-gray-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b949e"/>
    </marker>
    <marker id="arr-purple-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#bc8cff"/>
    </marker>
  </defs>

</svg>

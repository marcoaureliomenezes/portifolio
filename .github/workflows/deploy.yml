name: Deploy

on:
  push:
    branches: [develop, main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Deploy / Build
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: dist-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          test -f dist/index.html || { echo "dist/index.html not found"; exit 1; }
          test -s dist/index.html || { echo "dist/index.html is empty"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 3

  deploy-stage:
    name: Deploy / Stage
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: stage

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGE }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-deploy-stage-${{ github.run_id }}

      - name: Sync hashed assets to S3 (immutable cache)
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} \
            --delete \
            --exact-timestamps \
            --exclude "*" \
            --include "assets/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync everything else to S3 (no-cache)
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} \
            --delete \
            --exact-timestamps \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Upload route objects (extensionless, no-cache)
        run: |
          roots="dist/projetos"
          [ -d dist/blog ] && roots="dist/blog $roots"
          find $roots -mindepth 2 -maxdepth 2 -name index.html | sort | while read -r f; do
            key="${f#dist/}"; key="${key%/index.html}"
            aws s3 cp "$f" "s3://${{ vars.S3_BUCKET }}/$key" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache"
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_STAGE }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text

      - name: Deploy summary
        run: |
          echo "Stage deploy complete"
          echo "Commit: ${{ github.sha }}"
          echo "Site: https://${{ vars.DOMAIN }}"

  deploy-prod:
    name: Deploy / Production
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-deploy-prod-${{ github.run_id }}

      - name: Sync hashed assets to S3 (immutable cache)
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} \
            --delete \
            --exact-timestamps \
            --exclude "*" \
            --include "assets/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync everything else to S3 (no-cache)
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} \
            --delete \
            --exact-timestamps \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Upload route objects (extensionless, no-cache)
        run: |
          roots="dist/projetos"
          [ -d dist/blog ] && roots="dist/blog $roots"
          find $roots -mindepth 2 -maxdepth 2 -name index.html | sort | while read -r f; do
            key="${f#dist/}"; key="${key%/index.html}"
            aws s3 cp "$f" "s3://${{ vars.S3_BUCKET }}/$key" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache"
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text

      - name: Deploy summary
        run: |
          echo "Production deploy complete"
          echo "Commit: ${{ github.sha }}"
          echo "Site: https://${{ vars.DOMAIN }}"

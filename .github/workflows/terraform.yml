name: Terraform

# Apply manual por ambiente (workflow_dispatch), na role de infra do environment `infra`.
# Sem plan em PR, sem apply em push.

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Ambiente"
        type: choice
        options: [stage, prod]
        default: stage

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.0"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    name: Terraform / Apply ${{ inputs.env }}
    runs-on: ubuntu-24.04
    environment: infra
    defaults:
      run:
        working-directory: terraform/envs/${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        env:
          TF_ENV: ${{ inputs.env }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=portifolio/${TF_ENV}/terraform.tfstate" \
            -backend-config="region=${TF_STATE_REGION}"

      - name: Terraform Format check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: No delete or replace
        run: terraform show -json tfplan | jq -e '[.resource_changes[]?.change.actions[]] | index("delete") | not'

      - name: Terraform Apply
        run: terraform apply tfplan

name: CI Weekly (Full E2E)

# Full regression sweep every Sunday at 6 AM UTC.
# Also triggerable manually from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  full-e2e:
    name: Full E2E — Chromium + WebKit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright (Chromium + WebKit)
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: Run full E2E suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-weekly-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7

name: Deploy to Production S3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event.pull_request.merged == true)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build application
      run: |
        cd frontend
        npm run build
        
    - name: Test build
      run: |
        cd frontend
        # Verificar se os arquivos foram gerados
        if [ ! -f "dist/index.html" ]; then
          echo "❌ Build falhou - index.html não encontrado"
          exit 1
        fi
        echo "✅ Build verificado com sucesso"
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: sa-east-1
        
    - name: Deploy to S3
      run: |
        cd frontend
        echo "🚀 Iniciando deploy para S3..."
        aws s3 sync dist/ s3://marco-menezes.com --delete --exact-timestamps
        echo "✅ Deploy S3 concluído"
        
    - name: Invalidate CloudFront
      run: |
        echo "🔄 Invalidando cache CloudFront..."
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*" \
          --query 'Invalidation.Id' \
          --output text
        echo "✅ Cache CloudFront invalidado"
          
    - name: Deploy notification
      run: |
        echo "🎉 Deploy de produção concluído com sucesso!"
        echo "🌐 Site atualizado em: https://marco-menezes.com"
        echo "📊 Commit: ${{ github.sha }}"
        echo "👤 Author: ${{ github.actor }}"
